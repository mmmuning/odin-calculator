<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="result-container">
        <input id="equation-display" type="text" />
        <input id="result-display" type="text" />
      </div>
      <div class="buttons-container">
        <div class="column-one">
          <button class="action-btn clear-btn" data-action="clear">AC</button>
          <div>
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
          </div>
          <div>
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
          </div>
          <div>
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
          </div>
          <button class="number-btn zero-btn" data-number="0">0</button>
        </div>

        <div class="column-two">
          <button class="action-btn" data-action="delete">DEL</button>
          <button class="number-btn" data-number="9">9</button>
          <button class="number-btn" data-number="6">6</button>
          <button class="number-btn" data-number="3">3</button>
          <button class="number-btn" data-number=".">.</button>
        </div>

        <div class="column-three">
          <button class="operator-btn" data-operator="/">÷</button>
          <button class="operator-btn" data-operator="*">×</button>
          <button class="operator-btn" data-operator="-">-</button>
          <button class="operator-btn" data-operator="+">+</button>
          <button class="action-btn equal-btn" data-action="equal">=</button>
        </div>
      </div>
